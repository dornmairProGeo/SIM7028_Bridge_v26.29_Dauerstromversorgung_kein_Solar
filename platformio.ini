; SIM800 -> SIM7028 Translator Bridge v26.29 (1NCE / iot.1nce.net)
; Hardware: M5Stack ATOM DTU NB-IoT2 + AtomS3 Lite
;
; *** AUSGELEGT FUER KONSTANTE SPANNUNGSVERSORGUNG (Netzteil/Dauerstrom) ***
; *** NICHT fuer Solar-/Akkubetrieb: Modem bleibt dauerhaft wach        ***
; *** (kein PSM/eDRX/UART-Sleep, ESP32 ohne Light-/Deep-Sleep ausser    ***
; ***  der 1-Min-Pause beim taeglichen Neustart).                        ***

[env:m5stack-atoms3]
platform  = espressif32
board     = m5stack-atoms3
framework = arduino
board_build.filesystem = littlefs

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, default

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel
